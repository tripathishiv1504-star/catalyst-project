<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VaaniAccess - Voice-First Government Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#191c1d",
                        "tertiary-container": "#008939",
                        "on-background": "#191c1d",
                        "surface-tint": "#005bc0",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container-low": "#f3f4f5",
                        "on-primary-fixed-variant": "#004493",
                        "primary-fixed-dim": "#adc7ff",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#ffffff",
                        "outline-variant": "#c1c6d6",
                        "on-tertiary-fixed": "#002108",
                        "tertiary-fixed-dim": "#6ddd81",
                        "outline": "#727785",
                        "on-primary-fixed": "#001a41",
                        "on-secondary-fixed-variant": "#004494",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary": "#ffffff",
                        "primary": "#005bbf",
                        "surface-variant": "#e1e3e4",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#414754",
                        "on-secondary-fixed": "#001a41",
                        "on-tertiary-fixed-variant": "#005320",
                        "secondary-fixed": "#d8e2ff",
                        "inverse-surface": "#2e3132",
                        "on-secondary-container": "#00285c",
                        "secondary-container": "#4d8efe",
                        "surface": "#f8f9fa",
                        "surface-dim": "#d9dadb",
                        "tertiary": "#006d2c",
                        "primary-container": "#1a73e8",
                        "background": "#f8f9fa",
                        "surface-container-highest": "#e1e3e4",
                        "primary-fixed": "#d8e2ff",
                        "error-container": "#ffdad6",
                        "secondary": "#005ac1",
                        "surface-bright": "#f8f9fa",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#89fa9b",
                        "surface-container": "#edeeef",
                        "secondary-fixed-dim": "#adc6ff",
                        "inverse-primary": "#adc7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "sm": "12px",
                        "md": "24px",
                        "xs": "4px",
                        "xl": "80px",
                        "container-max": "1200px",
                        "base": "8px",
                        "gutter": "24px",
                        "lg": "48px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mic-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 91, 191, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(0, 91, 191, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 91, 191, 0); }
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-16 pb-20 md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-surface flex items-center justify-between px-margin-mobile md:px-xl h-16 w-full fixed top-0 z-50 shadow-sm transition-colors duration-200 ease-in-out">
<button aria-label="Menu" class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high dark:hover:bg-surface-variant p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="flex items-center gap-xs">
<img alt="VaaniAccess Logo" class="h-8 w-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAY00w5tUmqEe1IgVa6aWZP9X-dV84xjrr7_gxyoZhi_fAQoOm0jMJKgndzxt6i5AfZAK6eC39tthkzW03iKOruHvJj0MAPV07dYf0yLBbGcj2M8dglGLsoAXY35E4F6WFL7V924RKE1DiRASsWiHV-GDrJdQvJkfUSmYeBTzd5Z4bxZYai8vjsa4vLqS1TUum48YFSGD0ihBrjE1bTsJZ0jX5I27CyfvhawZ4UoCvC2yxEiNS_FAHlMMGlVOJ2rz2q_B_4rTFyUrvN"/>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed-dim">VaaniAccess</h1>
</div>
<button aria-label="Account" class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high dark:hover:bg-surface-variant p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-gutter max-w-container-max mx-auto w-full">
<!-- Voice Assistant Section -->
<section class="flex flex-col items-center justify-center text-center py-lg flex-grow min-h-[50vh]">
<button aria-label="Speak to Ask" class="mic-pulse w-32 h-32 md:w-40 md:h-40 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-all duration-300 mb-lg focus:outline-none focus:ring-4 focus:ring-primary-container">
<span class="material-symbols-outlined text-[64px]" style="font-size: 64px; font-variation-settings: 'FILL' 1;">mic</span>
</button>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-primary mb-sm">🎙 बोलकर पूछें</h2>
<p class="font-body-lg text-on-surface-variant max-w-md">Tap the microphone and ask your question in your preferred language.</p>
</section>
<!-- Quick Access / Prompts -->
<section class="w-full max-w-3xl mb-lg">
<h3 class="font-headline-md text-on-surface mb-md px-base">Frequently Asked</h3>
<div class="grid grid-cols-1 md:grid-cols-3 gap-md">
<!-- Card 1 -->
<button class="bg-surface hover:bg-surface-container-low transition-colors duration-200 p-md rounded-xl shadow-sm border border-surface-variant flex flex-col items-center justify-center text-center group">
<div class="w-16 h-16 bg-secondary-container text-on-secondary-container rounded-full flex items-center justify-center mb-sm group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-[32px]">school</span>
</div>
<span class="font-label-md text-on-surface">🎓 Scholarship Eligibility</span>
</button>
<!-- Card 2 -->
<button class="bg-surface hover:bg-surface-container-low transition-colors duration-200 p-md rounded-xl shadow-sm border border-surface-variant flex flex-col items-center justify-center text-center group">
<div class="w-16 h-16 bg-tertiary-container text-on-tertiary-container rounded-full flex items-center justify-center mb-sm group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-[32px]">agriculture</span>
</div>
<span class="font-label-md text-on-surface">🌾 Farmer Subsidies</span>
</button>
<!-- Card 3 -->
<button class="bg-surface hover:bg-surface-container-low transition-colors duration-200 p-md rounded-xl shadow-sm border border-surface-variant flex flex-col items-center justify-center text-center group">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-sm group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-[32px]">storefront</span>
</div>
<span class="font-label-md text-on-surface">🏪 Small Business Registration</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-safe bg-surface dark:bg-on-surface shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-fixed text-on-secondary-container dark:text-on-secondary-fixed-variant rounded-full px-4 py-1 active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm mt-1">Home</span>
</a>
<!-- History -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low active:scale-95 transition-transform duration-150 rounded-full" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-sm mt-1">History</span>
</a>
<!-- Support -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-low active:scale-95 transition-transform duration-150 rounded-full" href="#">
<span class="material-symbols-outlined">contact_support</span>
<span class="font-label-sm mt-1">Support</span>
</a>
</nav>
<!-- Desktop Sidebar/Nav (Hidden on Mobile) -->
<aside class="hidden md:flex flex-col fixed left-0 top-16 bottom-0 w-64 bg-surface border-r border-surface-variant pt-lg px-md gap-sm z-40">
<!-- Replicating Bottom Nav for Desktop Sidebar context -->
<a class="flex items-center gap-sm bg-secondary-container text-on-secondary-container px-md py-sm rounded-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md">Home</span>
</a>
<a class="flex items-center gap-sm text-on-surface-variant hover:bg-surface-container-low px-md py-sm rounded-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md">History</span>
</a>
<a class="flex items-center gap-sm text-on-surface-variant hover:bg-surface-container-low px-md py-sm rounded-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined">contact_support</span>
<span class="font-label-md">Support</span>
</a>
</aside>
</body></html>
